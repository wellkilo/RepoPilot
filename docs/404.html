<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#071019" />
    <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
    <title>页面不存在 · RepoPilot</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        background: #071019;
        color: #eaf3ff;
      }
      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        background:
          linear-gradient(rgba(73, 214, 208, 0.03) 1px, transparent 1px),
          linear-gradient(90deg, rgba(73, 214, 208, 0.03) 1px, transparent 1px), #071019;
        background-size: 32px 32px;
      }
      main {
        width: min(560px, calc(100% - 40px));
        padding: 42px;
        border: 1px solid #22384b;
        background: #0c1824;
      }
      span {
        color: #49d6d0;
        font-size: 12px;
      }
      h1 {
        margin: 20px 0 12px;
        font-size: clamp(32px, 8vw, 60px);
      }
      p {
        color: #7f96aa;
        line-height: 1.8;
      }
      a {
        display: inline-flex;
        margin-top: 18px;
        padding: 12px 16px;
        border: 1px solid #49d6d0;
        color: #071019;
        background: #49d6d0;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <span>404 · ROUTE NOT FOUND</span>
      <h1>这条证据链不存在</h1>
      <p>目标页面没有被发布，或路径已经移动。返回 RepoPilot 项目展示首页继续查看。</p>
      <a href="./">返回首页</a>
    </main>
  </body>
</html>
