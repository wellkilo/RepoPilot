services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: repopilot
      POSTGRES_PASSWORD: repopilot
      POSTGRES_USER: repopilot
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repopilot -d repopilot"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "5432:5432"
    volumes:
      - repopilot-postgres:/var/lib/postgresql/data
      - ./apps/control-plane/sql:/docker-entrypoint-initdb.d:ro

volumes:
  repopilot-postgres:
